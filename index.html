<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poké Hub</title>
    <style>
        /* ================= ESTILOS GERAIS ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5; /* Cor de fundo igual ao Figma */
            color: #333;
            padding-bottom: 40px;
        }

        /* ================= CABEÇALHO (HEADER) ================= */
        header {
            background-color: #0d2c7f; /* Azul escuro */
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .logo .poke {
            color: #5d8bc9; /* Azul claro */
            margin-right: 5px;
        }

        .logo .hub {
            background-color: #fdbb0a; /* Amarelo */
            color: black;
            padding: 2px 8px;
            border-radius: 4px;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* [LOCAL DA FOTO DE PERFIL] */
        .profile-pic {
            width: 40px;
            height: 40px;
            background-color: #0a1f5c; /* Placeholder */
            border-radius: 50%;
            display: flex
