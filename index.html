<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poké Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Poké Hub</div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Marketing</a>
            <a href="#">Sobre</a>
            <div class="profile-icon"></div>
        </nav>
    </header>

    <main class="container"></main>

            <div class="hero-banner">
                <h1>Nova Geração anunciada</h1>
                <p>Depois de 4 anos de espera</p>
            </div>


            <div class="bottom-grid">

            </div>
                <div class="card-weekly">
                    <h3>Pokémon destaque semanal</h3>
                    <div class="weekly-names">
                        <span>sprigatito</span>
                        <span>eevee</span>
                    </div>
                    <div class="weekly-images">
                        <div class="placeholder-img green"></div>
                        <div class="placeholder-img brown"></div>
                    </div>
                </div>

                <div class="card-map">
                    <div class="placeholder-map">[ Mapa - Regiões ]</div>
                </div>
            </div>

        </section>

        <aside class="sidebar">
            <div class="poke-card orange">
                <div class="placeholder-avatar"></div>
            </div>
            <div class="poke-card blue">
                <div class="placeholder-avatar"></div>
            </div>
            <div class="poke-card yellow">
                <div class="placeholder-avatar"></div>
            </div>
        </aside>

    </main>

</body>
</html>
