<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poké Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <span>Poké</span> <span class="badge">Hub</span>
        </div>
        <nav class="nav-links">
            <a href="#pagina1" class="active">Home</a>
            <a href="#pagina2">Marketing</a>
            <a href="#pagina3">Sobre</a>
        </nav>
        <div class="user-profile">
            <div class="avatar-placeholder"></div>
        </div>
    </header>

    <main class="container">

        <section id="pagina1" class="page-section">
            <div class="grid-p1">
                
                <div class="hero-banner">
                    <img src="pokemon-winds-and-waves-gen-10-starters-revealed 1.png" alt="Cenário Nova Geração" class="bg-image">
                    <div class="hero-content">
                        <h1>Nova Geração anunciada</h1>
                        <p>Depois de 4 anos de espera</p>
                    </div>
                </div>

                <div class="side-panel-starters">
                    <div class="starter-card red-bg">
                        <img src="images-removebg-preview (1) 2.png" alt="Ponbom">
                    </div>
                    <div class="starter-card blue-bg">
                        <img src="images-removebg-preview (3) 1.png" alt="Gecqua">
                    </div>
                    <div class="starter-card green-bg">
                        <img src="images-removebg-preview (2) 1.png" alt="Browt">
                    </div>
                </div>

                <div class="destaque-semanal">
                    <h3>Pokémon destaque semanal</h3>
